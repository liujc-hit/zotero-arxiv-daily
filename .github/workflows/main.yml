name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '07 4 * * *'
      timezone: 'Asia/Shanghai'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Load encrypted sent DOI state
        id: load-sent-doi-state
        uses: actions/github-script@v8
        env:
          SENT_DOI_STATE_ENABLED: ${{ vars.SENT_DOI_STATE_ENABLED || 'false' }}
          SENT_DOI_STATE_KEY_PRESENT: ${{ secrets.SENT_DOI_STATE_KEY != '' }}
        with:
          retries: 0
          script: |
            const loadSentDoiState = require("./.github/scripts/load-sent-doi-state.cjs");
            await loadSentDoiState({ github, context, core });

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_KEY_2: ${{ secrets.OPENALEX_API_KEY_2 }}
          NIH_API: ${{ secrets.NIH_API }}
          IEEE_XPLORE_API: ${{ secrets.IEEE_XPLORE_API }}
          ELSEVIER_API: ${{ secrets.ELSEVIER_API }}
          SPRINGER_API: ${{ secrets.SPRINGER_API }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          PUBMED_EMAIL: ${{ vars.PUBMED_EMAIL }}
          PUBMED_QUERY: ${{ vars.PUBMED_QUERY }}
          PUBMED_ISSNS: ${{ vars.PUBMED_ISSNS || '[]' }}
          PAPER_SOURCES: ${{ vars.PAPER_SOURCES || '["arxiv","openalex"]' }}
          ABSTRACT_ENRICHMENT_ENABLED: ${{ vars.ABSTRACT_ENRICHMENT_ENABLED || 'false' }}
          PUBMED_ENABLED: ${{ vars.PUBMED_ENABLED || 'false' }}
          IEEE_ENABLED: ${{ vars.IEEE_ENABLED || 'false' }}
          ELSEVIER_ENABLED: ${{ vars.ELSEVIER_ENABLED || 'false' }}
          SPRINGER_ENABLED: ${{ vars.SPRINGER_ENABLED || 'false' }}
          VENUE_PRESTIGE_ENABLED: ${{ vars.VENUE_PRESTIGE_ENABLED || 'false' }}
          OPENALEX_ALLOW_ANONYMOUS: ${{ vars.OPENALEX_ALLOW_ANONYMOUS || 'false' }}
          SENT_DOI_STATE_ENABLED: ${{ vars.SENT_DOI_STATE_ENABLED || 'false' }}
          SENT_DOI_STATE_KEY: ${{ secrets.SENT_DOI_STATE_KEY }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run --locked src/zotero_arxiv_daily/main.py \
            '++sent_doi_state.enabled=${oc.decode:${oc.env:SENT_DOI_STATE_ENABLED}}' \
            '++sent_doi_state.path=.state/sent-dois.fernet' \
            '++sent_doi_state.key=${oc.env:SENT_DOI_STATE_KEY}'
