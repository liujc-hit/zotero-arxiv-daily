zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: null # Or set a list of glob patterns, e.g. ["2026/survey/**","2026/reading-group/**"]

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  api_mode: chat_completion
  thinking: disabled # MiniMax-M3 only; MiniMax-M2-family models cannot disable thinking and must use null.
  generation_kwargs:
    model: MiniMax-M3

source:
  arxiv:
    category: ["cs.AI","cs.CV","cs.LG","cs.CL"]
  crossref:
    mailto: ${oc.env:CROSSREF_MAILTO,null}
    lookback_days: 1
  openalex:
    api_keys:
      - ${oc.env:OPENALEX_API_KEY,null} # Primary free key; null sends no key.
      - ${oc.env:OPENALEX_API_KEY_2,null} # Failover key used when the primary is exhausted.
    allow_anonymous: ${oc.decode:${oc.env:OPENALEX_ALLOW_ANONYMOUS,'false'}} # Opt-in to anonymous requests; without a key, false makes a requested openalex source use the crossref substitute.
    lookback_days: 30
  pubmed:
    query: ${oc.env:PUBMED_QUERY,null} # PubMed discovery query; required when the pubmed source is enabled.
    contact_email: ${oc.env:PUBMED_EMAIL,null}
    api_key: ${oc.env:NIH_API,null}

enrichment:
  enabled: ${oc.decode:${oc.env:ABSTRACT_ENRICHMENT_ENABLED,'false'}}
  workers: 3
  max_papers: 50
  pubmed:
    enabled: ${oc.decode:${oc.env:PUBMED_ENABLED,'false'}}
    contact_email: ${oc.env:PUBMED_EMAIL,null}
    api_key: ${oc.env:NIH_API,null}
    request_rate: 10.0
    issns: ${oc.decode:${oc.env:PUBMED_ISSNS,'[]'}}
  ieee:
    enabled: ${oc.decode:${oc.env:IEEE_ENABLED,'false'}}
    api_key: ${oc.env:IEEE_XPLORE_API,null}
    request_rate: 1.0
    issns: []
    doi_prefixes: ["10.1109"]
  elsevier:
    enabled: ${oc.decode:${oc.env:ELSEVIER_ENABLED,'false'}}
    api_key: ${oc.env:ELSEVIER_API,null}
    request_rate: 9.0
    issns: []
    doi_prefixes: ["10.1016"]
  springer:
    enabled: ${oc.decode:${oc.env:SPRINGER_ENABLED,'false'}}
    api_key: ${oc.env:SPRINGER_API,null}
    request_rate: 1.0
    issns: []
    doi_prefixes: ["10.1007","10.1038","10.1057","10.1186"]

reranker:
  venue_prestige:
    enabled: ${oc.decode:${oc.env:VENUE_PRESTIGE_ENABLED,'false'}}
    weight: 0.1
    max_multiplier: 1.5

executor:
  debug: ${oc.decode:${oc.env:DEBUG,null}}
  source: ${oc.decode:${oc.env:PAPER_SOURCES,'["arxiv","openalex"]'}}

sent_doi_state:
  enabled: ${oc.decode:${oc.env:SENT_DOI_STATE_ENABLED,'false'}} # Missing resolves to boolean false (fail closed).
  path: .state/sent-dois.fernet
  key: ${oc.env:SENT_DOI_STATE_KEY,null} # Optional Fernet key; required only when enabled.
