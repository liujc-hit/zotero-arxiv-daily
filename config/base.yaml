zotero:
  user_id: ??? # User ID of your Zotero account.
  api_key: ??? # An Zotero API key with read access.
  include_path: null # A list of glob patterns marking the Zotero collections that should be included. Example: ["2026/survey/**","2026/reading-group/**"]
  ignore_path: null # A list of glob patterns marking the Zotero collections that should be excluded. Example: ["2026/ignore/**","archive/**"]

source:
  arxiv:
    category: null # The categories of target arxiv papers. Find the abbr of your research area from [here](https://arxiv.org/category_taxonomy). Example: ["cs.AI","cs.CV","cs.LG","cs.CL"]
    include_cross_list: false # Whether to include arXiv cross-list papers in subscribed categories. Example: true
  biorxiv:
    category: null # The categories of target biorxiv papers. Find categories from [here](https://www.biorxiv.org/). Example: ["biochemistry","animal behavior and cognition"]
  medrxiv:
    category: null # The categories of target medrxiv papers. Find categories from [here](https://www.medrxiv.org/) Example: ["psychiatry and clinical psychology", "neurology"]
  chemrxiv:
    include_new_versions: false # Whether to include revised versions (v2, v3, ...) of previously posted chemrxiv preprints in addition to new first postings. chemrxiv has no category filter: all new preprints (a few dozen per day) are retrieved via Crossref and left to the reranker. Example: true
  crossref:
    mailto: null # Contact email for polite Crossref API access. Required whenever a Crossref retriever is constructed: the crossref source itself, or an openalex source replaced at startup because it has no API key and allow_anonymous is false. A blank value in those cases fails the run at startup; abstract enrichment never uses it. Example: curator@example.com
    lookback_days: 1 # Number of completed UTC publication days to retrieve, ending yesterday. Example: 3
  openalex:
    api_keys: [] # Ordered list of free OpenAlex API keys; the first usable key is sent and later entries serve as failover. Empty/null entries are skipped. Example: ["your-openalex-api-key","your-backup-openalex-api-key"]
    allow_anonymous: false # Opt-in to keyless anonymous requests when no API key is configured; with no key and this false, a requested openalex source is replaced by one crossref retriever at startup. Example: true
    lookback_days: 30 # Number of completed UTC publication days to retrieve, ending yesterday. Wider window mitigates OpenAlex's delayed-index by capturing works indexed up to ~a month after publication; paired with persistent cross-run deduplication. Example: 30
  pubmed:
    query: null # The PubMed discovery query for new papers, using PubMed search syntax. Required when the pubmed source is enabled. Example: "robotics[Title]"
    contact_email: null # Contact email for polite PubMed API access. Required when the pubmed source is enabled. Example: curator@example.com
    api_key: null # Optional NCBI API key that raises the PubMed request allowance. Example: your-ncbi-api-key
    lookback_days: 3 # Number of completed UTC entry days to retrieve, ending yesterday. Example: 3
    request_rate: 10.0 # Maximum PubMed requests per second; NCBI allows 10 with an API key and 3 without. Example: 3.0

enrichment:
  enabled: false
  workers: 3
  max_papers: 50
  pubmed:
    enabled: false
    contact_email: null
    api_key: null
    request_rate: 10.0
    issns: []
  ieee:
    enabled: false
    api_key: null
    request_rate: 1.0
    issns: []
    doi_prefixes: ["10.1109"]
  elsevier:
    enabled: false
    api_key: null
    request_rate: 9.0
    issns: []
    doi_prefixes: ["10.1016"]
  springer:
    enabled: false
    api_key: null
    request_rate: 1.0
    issns: []
    doi_prefixes: ["10.1007","10.1038","10.1057","10.1186"]

email:
  sender: ??? # The email account of the SMTP server that sends you email. Example: abc@qq.com
  receiver: ??? # The email account that receives the paper list. Example: abc@outlook.com
  smtp_server: ??? # The SMTP server that sends the email. Ask your email provider (Gmail, QQ, Outlook, ...) for its SMTP server. Example: smtp.qq.com
  smtp_port: ??? # The port of SMTP server. Example: 465
  sender_password: ??? # The password of the sender account. Note that it's not necessarily the password for logging in the e-mail client, but the authentication code for SMTP service. Ask your email provider for this. Example: abcdefghijklmn

llm:
  api:
    key: ??? # API Key of your LLM API. Example: sk-xxx
    base_url: ??? # API URL of your LLM API. Example: https://api.openai.com/v1
  api_mode: chat_completion # The LLM API to use. Options: chat_completion or response.
  thinking: null # Set to 'disabled' to turn off thinking. Only maps to provider fields for the exact model 'MiniMax-M3'; MiniMax-M2-family models cannot disable thinking and must keep this null.
  generation_kwargs:
  # Arguments for the selected LLM API.
    max_tokens: 16384
    model: ???
  language: English # Preferred language for the TL;DR. Example: English

reranker:
  topk: 10 # Score each candidate as the mean of its top-k most similar Zotero papers. Lower = stricter/more focused, higher = smoother/broader. Must be >= 1.
  recency_half_life_days: null # When set, the top-k matched Zotero papers are weighted by exp(-age_days/half_life) so recently added papers (your current direction) dominate the score. null disables weighting. Example: 180
  mmr_lambda: null # When set (e.g. 0.7), reorders the top candidates by Maximal Marginal Relevance so near-duplicate papers do not fill consecutive email slots. MMR reuses the candidate embeddings and does not add a duplicate model/embedding pass. null keeps pure score order. Example: 0.7
  venue_prestige:
    enabled: false
    weight: 0.1
    max_multiplier: 1.5
  local:
    model: jinaai/jina-embeddings-v5-text-nano-retrieval # The Hugging Face model name of the local embedding model. Example: jinaai/jina-embeddings-v5-text-nano
    encode_kwargs:
    # The kwargs for the encode method of the local embedding model. Details see [here](https://www.sbert.net/docs/package_reference/SentenceTransformer.html#sentence_transformers.SentenceTransformer.encode)
      task: retrieval
      prompt_name: document
  api:
    key: null # API Key of your embedding model API. Example: sk-xxx
    base_url: null # API URL of your embedding model API. Example: https://api.openai.com/v1
    model: null # The model name of the embedding model. Example: text-embedding-3-large
    batch_size: null # The batch size for embedding API requests. Adjust to match your provider's limit. Example: 64

executor:
  debug: false # Whether to use debug mode. Example: true
  send_empty: false # Whether to send an empty email even if no new papers today. Example: true
  max_paper_num: 100 # The maximum number of the papers presented in the email. Example: 100
  min_score: null # Minimum reranker score (0-10 scale) for a paper to appear in the email. Papers scoring below the floor are dropped; pinned papers bypass it. null disables the floor. Raise for precision, lower for recall. Example: 5.0
  pin_keywords: null # List of keywords to force-pin to the TOP of the email, on top of the recommendation algorithm. A paper whose title OR abstract contains any keyword (case-insensitive) is pinned. Pinned papers do NOT count against max_paper_num. Example: ["Mamba","state space model"]
  max_pinned_num: 20 # Upper bound on pinned papers per email. Matches beyond this cap fall back to the normal recommendation pool. Example: 20
  enrich_workers: 8 # Number of parallel workers for fetching full text + generating TL;DR/affiliations for the final top-N papers. Raise for faster enrichment, lower if your LLM/embedding provider rate-limits you.
  source: ??? # The sources of papers to retrieve. Example: ['arxiv','biorxiv','medrxiv','chemrxiv','openalex','pubmed']
  reranker: local # The reranker to use. Example: 'local' or 'api'

sent_doi_state:
  enabled: false # Whether to persist the canonical identities of sent papers in an encrypted local file so later runs skip them. Each paper is identified by a valid DOI or DOI-resolver URL first, else the canonical arXiv ID (revisions and abs/pdf variants collapse), else a narrowly normalized stable URL; papers with none are not tracked. The DOI-named section, variables, and file path are retained legacy names. Example: true
  path: .state/sent-dois.fernet # Path of the encrypted sent-state file, authenticated with Fernet and replaced atomically after each successful send. Legacy filename retained. Example: .state/sent-dois.fernet
  key: null # Fernet key encrypting the sent state. Required when enabled; generate one with `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`. Example: your-fernet-key
